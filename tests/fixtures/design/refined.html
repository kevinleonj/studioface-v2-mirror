<!doctype html><html><head><style>
:root{--ink:#14110f;--paper:#f2ede4;--signal:#c2410c;--line:#d8cfc0}
body{font-family:"Söhne","Helvetica Neue",sans-serif;color:var(--ink);background:var(--paper)}
h1{font-family:"GT Sectra","Georgia",serif;font-size:3.25rem;letter-spacing:-.02em}
.stack{display:grid;grid-template-columns:7fr 5fr;gap:4rem}
.cta{background:var(--signal);color:#fff;border-radius:2px}
.rule{border-top:1px solid var(--line)}

<h1>Tu foto de perfil profesional</h1>
<div class="stack"><p>Sube tus selfies.</p><img src="/before-after-1.jpg" alt=""></div>

</body></html>
