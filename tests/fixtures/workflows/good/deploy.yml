name: deploy
on:
  push:
    branches: [main]
jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install -e ".[dev]"
      - run: python scripts/ci.py
  deploy:
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: google-github-actions/auth@v2
      - run: docker build -t "$IMAGE" .
      - run: gcloud run deploy studioface-api --image "$IMAGE"
